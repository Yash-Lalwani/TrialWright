services:
  - type: web
    name: trialwright-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: LLM_MODE
        value: replay
      - key: CORS_ORIGINS
        value: https://trialwright-frontend.vercel.app
      # Only needed if LLM_MODE is switched to live.
      - key: OPENROUTER_API_KEY
        sync: false
