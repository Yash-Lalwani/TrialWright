# ICH M11 CeSHarP template: table of contents and checkable requirements.
# Source: FDA copy of the final ICH M11 Template (adopted 19 Nov 2025; FDA edition May 2026)
#   https://www.fda.gov/media/192647/download   (headings, levels and applicability are extracted from the template itself)
# Authored by Person B from the template's instructional text: required_subelements, synonyms, min_words.
# These are a good-faith reading of the template, not an official ICH artifact. Spot-check before relying on them.
#
# Fields
#   id / title / level / parent : M11 numbering (title in sentence case where the template uses ALL CAPS)
#   applicability : universal    = black text, should appear in all protocols   -> required: true
#                   conditional  = {braces}, include if applicable to the trial  -> required: false
#                   optional     = blue text, may be modified or deleted         -> required: false
#                   (the template says: keep a universal heading and write "Not applicable" if it does not apply,
#                    so a heading with "Not applicable" counts as PRESENT.)
#                   per_objective = repeated once per objective (3.1.1, 10.4.1.x ...); real protocols rarely number these -> required: false,
#                                   check the L2 parent (3.1, 10.4) instead
#   container : heading-only parent ("No text is intended here"). Treat as present if any child is present;
#               do not count it as thin for lack of words.
#   min_words : word floor for "thin" (0 for containers). Thin = fewer words than this OR a required_subelement missing.
#   required_subelements : each entry is ONE sub-element; '|' separates accepted alternatives; match case-insensitively
#               as a substring of THAT section's text only (the section A2 mapped to this id). Never search the whole document.
#   sub_elements / word_floor : the same data as required_subelements / min_words, in the field names and
#               dict form ({name, patterns}) that backend/preflight/checks/completeness.py reads. Regex-escaped. Keep both in sync.
#   synonyms : alternative headings used by real pre-M11 protocols, for fuzzy heading mapping (A2).
