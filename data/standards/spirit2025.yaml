# SPIRIT 2025 checklist (34 items) for protocols of randomised trials.
# Source: Chan A-W et al., "SPIRIT 2025 statement: updated guideline for protocols of randomised trials", BMJ/Lancet/JAMA/others 2025.
#   https://pmc.ncbi.nlm.nih.gov/articles/PMC12035670/   Licence: CC BY 4.0. Item wording is reproduced verbatim from the paper's checklist table.
# Authored by Person B: required_subelements, conditional_subelements, m11_ids, applies_if. Good-faith reading, not an official artifact.
#
#   patterns / sub_elements / word_floor : aliases in the shape backend/preflight/checks/completeness.py reads (regex-escaped).
#               patterns = anchor alternatives (first required sub-element) that locate the item; keep in sync with required_subelements.
#
# Unit of counting = the 34 numbered items. Sub-items (e.g. 24a/24b/24c) are listed in sub_items and drive "thin" detection (B3).
#   required_subelements    : one entry per concept that must appear; '|' = accepted alternatives; case-insensitive substring match.
#   conditional_subelements : only required when `when` holds: 'blinded' (trial is blinded) or 'applicable' (the sub-item applies to the trial).
#   applies_if              : 'randomised' items (21-23) are skipped for single-arm / non-randomised protocols; 'always' otherwise.
#   m11_ids                 : where this content usually lives in an M11 protocol (ids from m11_toc.yaml); [] = no direct M11 home.
#   Status rule: search ONLY the text of the mapped sections (m11_ids, resolved to the protocol's own sections by A2).
#                Fall back to the whole document ONLY when m11_ids is empty. Whole-document search is far too lenient
#                (a smoke test on one real protocol marked 30 of 34 items present that way).
#                present if all required_subelements are found; thin if some are; missing if none.
