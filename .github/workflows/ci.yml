name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      # Add with B once `preflight bench` lands: uv run preflight bench --set test --quick

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start backend + frontend
        run: docker compose up -d --build --wait
      - name: Smoke test both services
        run: |
          curl -sf localhost:8000/api/health
          curl -sf -o /dev/null localhost:3000/ && echo "frontend ok"
          curl -sf -o /dev/null -H "Origin: http://localhost:3000" localhost:8000/api/protocols && echo "api from frontend origin ok"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
